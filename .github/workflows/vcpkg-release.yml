name: vcpkg release

# Validates that a registry release is internally consistent and actually
# installable. The registry is "published" by pushing main + the v<version>
# tag; this workflow is the gate that catches a broken release (sha512 pin
# drift, version/tag mismatch, stale versions/ git-tree, or an install that
# fails on some triplet).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

# The latest installed Bun (workspace Tooling rule 10, letter H31). The release job installs it
# itself, pinned by the sha256 of bun-linux-x64.zip in that release's SHASUMS256.txt: move
# BUN_VERSION and BUN_SHA256 together.
env:
  BUN_VERSION: "1.4.4"
  BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Header sha512 pin matches the header
        run: |
          want=$(grep -oP 'UWL_HEADER_SHA512 "\K[^"]+' ports/universal-wasm-loader-c/portfile.cmake)
          got=$(sha512sum universal_wasm_loader.h | awk '{print $1}')
          echo "want=$want"; echo "got =$got"
          [ "$want" = "$got" ] || { echo "::error::UWL_HEADER_SHA512 does not match universal_wasm_loader.h"; exit 1; }
      - name: LICENSE sha512 pin matches LICENSE
        run: |
          want=$(grep -oP 'UWL_LICENSE_SHA512 "\K[^"]+' ports/universal-wasm-loader-c/portfile.cmake)
          got=$(sha512sum LICENSE | awk '{print $1}')
          [ "$want" = "$got" ] || { echo "::error::UWL_LICENSE_SHA512 does not match LICENSE"; exit 1; }
      - name: portfile UWL_VERSION matches vcpkg.json version
        run: |
          pf=$(grep -oP 'set\(UWL_VERSION "\K[^"]+' ports/universal-wasm-loader-c/portfile.cmake)
          mf=$(grep -oP '"version"\s*:\s*"\K[^"]+' ports/universal-wasm-loader-c/vcpkg.json)
          [ "$pf" = "$mf" ] || { echo "::error::portfile UWL_VERSION ($pf) != vcpkg.json version ($mf)"; exit 1; }
      - name: versions/ git-tree matches the port tree
        run: |
          want=$(git rev-parse HEAD:ports/universal-wasm-loader-c)
          got=$(jq -r '.versions[0]."git-tree"' versions/u-/universal-wasm-loader-c.json)
          [ "$want" = "$got" ] || { echo "::error::versions git-tree ($got) != HEAD port tree ($want)"; exit 1; }
      - name: On a tag, the tag must match vcpkg.json version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mf=$(grep -oP '"version"\s*:\s*"\K[^"]+' ports/universal-wasm-loader-c/vcpkg.json)
          [ "$tag" = "$mf" ] || { echo "::error::tag v$tag != vcpkg.json version $mf"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: api-surface.json is current (compatibility gate, Rule 1)
        run: bun run scripts/surface.ts --check
      - name: Compatibility gate self-test
        run: bun run scripts/check-compat-gate.ts
      - name: Release-page script self-test (mock GitHub API)
        run: bun run scripts/check-github-release.ts

  compat:
    # Compatibility gate on the tagged release commit (Rules 2 + 3, cmem/compat-gate.md):
    # the version must meet the floor vs the previous tag, and for a patch/minor
    # the previous tag's tests must pass against this header.
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fetch the wasmtime C API
        run: make fetch WASMTIME_PLATFORM=x86_64-linux
      - name: Floor and previous-tag tests
        run: WASMTIME_PLATFORM=x86_64-linux bun run scripts/compat.ts --release

  install:
    # Real overlay-port install across platforms. Runs only when the v<version>
    # tag is guaranteed to exist (the portfile downloads the header from it).
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-latest
            triplet: arm64-osx
          - os: windows-latest
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh"
          fi
      - name: Install port (overlay)
        run: |
          vcpkg_bin="$RUNNER_TEMP/vcpkg/vcpkg"
          [ "$RUNNER_OS" = "Windows" ] && vcpkg_bin="$vcpkg_bin.exe"
          "$vcpkg_bin" install universal-wasm-loader-c \
            --overlay-ports="$PWD/ports" --triplet "${{ matrix.triplet }}"
      - name: Copyright bundles both licenses (MIT + Apache-2.0 WITH LLVM-exception)
        run: |
          cp="$RUNNER_TEMP/vcpkg/installed/${{ matrix.triplet }}/share/universal-wasm-loader-c/copyright"
          grep -qi 'Permission is hereby granted' "$cp" || { echo "::error::MIT text missing from copyright"; exit 1; }
          grep -qi 'Apache License' "$cp"            || { echo "::error::wasmtime Apache license missing from copyright"; exit 1; }
          grep -qi 'LLVM Exception' "$cp"            || { echo "::error::LLVM exception missing from copyright"; exit 1; }
          echo "copyright OK: $(wc -c < "$cp") bytes"

  release:
    # The GitHub Release page IS the release from v2.1.0's successor on (owner, 2026-11-09:
    # "yes. From this point forward it is the release page"; workspace letter H32). Made by CI,
    # never by hand or the GitHub CLI (H30), only after every check above passed on the tag.
    # contents: write and nothing else; no third-party action runs beside the token (C30), so the
    # checkout is a credential-less clone and Bun is installed by hand, pinned by sha256.
    if: github.ref_type == 'tag'
    needs: [validate, compat, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (no credentials)
        run: |
          git clone --depth=1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY" .
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::the tag moved: it is $head, this run is for $GITHUB_SHA"
            exit 1
          fi
      - name: Install Bun (pinned by sha256)
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  bun.zip" | sha256sum -c -
          unzip -q bun.zip && mkdir -p "$HOME/.bun/bin" && mv bun-linux-x64/bun "$HOME/.bun/bin/" && rm -rf bun.zip bun-linux-x64
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
      # GitHub's REST API with the job's own token. The script refuses unless the tag peels to this
      # run's commit (POST /releases would create a missing tag), does nothing if the page exists,
      # and reads the page back. Every request has a 30 s limit.
      - name: Create the GitHub Release page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/github-release.ts
